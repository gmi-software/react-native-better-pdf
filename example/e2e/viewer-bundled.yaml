# Bundled asset loads, reports its page count, and navigates natively.
appId: software.gmi.betterpdf.example
---
- runFlow: _start.yaml
- tapOn: "Viewer"
- tapOn: "Bundled sample.*"
- extendedWaitUntil:
    visible: "1 / 3"
    timeout: 15000
- tapOn: "Last"
- extendedWaitUntil:
    visible: "3 / 3"
    timeout: 5000
- tapOn: "First"
- extendedWaitUntil:
    visible: "1 / 3"
    timeout: 5000
- takeScreenshot: viewer-bundled
- tapOn: "‹ Back"
