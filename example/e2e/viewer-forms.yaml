# Forms (AcroForm) on the `forms` fixture: filled in by touch and from code
# (ref.setFormFieldValues), read back (ref.getFormFields, listed on the
# event line by "Fields"), with onFormChange for the reader's changes only,
# then exported (ref.exportDocument) and the copy reopened.
appId: software.gmi.betterpdf.example
# The fields sit at the same screen percentages on both platforms' devices.
env:
  NAME: "59%, 38%"
  AGREE: "35%, 53%"
  PRO: "52%, 57%"
  COUNTRY: "50%, 61%"
  POSTCODE: "44%, 91%"
---
- runFlow: _start.yaml
- tapOn: "Viewer"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "forms(, .*)?" } }
- extendedWaitUntil: { visible: "1 / 2", timeout: 15000 }
- waitForAnimationToEnd

# Every field, in the field tree's order; loading reports no change.
- assertNotVisible: "form: .*"
- tapOn: "Fields"
- extendedWaitUntil:
    visible: "fields 13: name= email=jan@example.com notes= agree=off plan=basic country=Poland colours=Green id=A-1234 phone= address.city= postcode= date= signature=unsigned"
    timeout: 5000

# Rejected while the form is as loaded, when iOS exports a copy of the file:
# an export into a directory used to delete it with everything in it.
- tapOn: "Bad"
- extendedWaitUntil: { visible: "bad: .*read-only.* \\| .*cannot replace the displayed.* \\| .*export path is a directory.*; keep.txt kept", timeout: 10000 }

# By touch: text is reported once, when editing ends; toggles at once.
- tapOn: { point: "${NAME}" }
- waitForAnimationToEnd
- inputText: "Anna"
- pressKey: Enter
- extendedWaitUntil: { visible: "form: name=Anna", timeout: 5000 }
# Android closes its editor (and keyboard) itself; hideKeyboard would go back.
- runFlow:
    when: { platform: iOS }
    commands:
      - hideKeyboard
- tapOn: { point: "${AGREE}" }
- extendedWaitUntil: { visible: "form: agree=on", timeout: 5000 }
- tapOn: { point: "${PRO}" }
- extendedWaitUntil: { visible: "form: plan=pro", timeout: 5000 }
# A choice: Android lists the options to pick from; iOS's PDFKit shows a
# picker wheel, reported as it turns.
- tapOn: { point: "${COUNTRY}" }
- waitForAnimationToEnd
- runFlow:
    when: { platform: Android }
    commands:
      - tapOn: "Germany"
- runFlow:
    when: { platform: iOS }
    commands:
      - swipe: { start: "50%, 93%", end: "50%, 89%", duration: 800 }
- extendedWaitUntil: { visible: "form: country=Germany", timeout: 5000 }
- runFlow:
    when: { platform: iOS }
    commands:
      - tapOn: "Done"
      - waitForAnimationToEnd
# A field at the bottom: the document scrolls it above the keyboard
# (screenshot for review).
- tapOn: { point: "${POSTCODE}" }
- waitForAnimationToEnd
- takeScreenshot: forms-keyboard
- inputText: "00-950"
- pressKey: Enter
- extendedWaitUntil: { visible: "form: postcode=00-950", timeout: 5000 }
- runFlow:
    when: { platform: iOS }
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: forms-touched

# From code, without onFormChange; all or none.
- tapOn: "Fill"
- extendedWaitUntil: { visible: "fill: done", timeout: 5000 }
- tapOn: "Fields"
- extendedWaitUntil:
    visible: "fields 13: name=Ewa email=jan@example.com notes=First line/Second line agree=on plan=pro country=France colours=Blue id=A-1234 phone= address.city=Kraków postcode=00-950 date= signature=unsigned"
    timeout: 5000
- tapOn: "Bad"
- extendedWaitUntil: { visible: "bad: .*read-only.* \\| .*cannot replace the displayed.* \\| .*export path is a directory.*; keep.txt kept", timeout: 10000 }
- tapOn: "Fields"
- extendedWaitUntil: { visible: "fields 13: name=Ewa .*", timeout: 5000 }

# Filling off: a tap on a field is a page tap, and changes nothing.
- tapOn: "First"
- waitForAnimationToEnd
- tapOn: "Touch on"
- tapOn: { point: "${AGREE}" }
- extendedWaitUntil: { visible: "tap: page 1 at .*", timeout: 5000 }
- tapOn: "Touch off"
- tapOn: "Fields"
- extendedWaitUntil: { visible: "fields 13: .* agree=on .*", timeout: 5000 }

# The exported copy has the values (iOS writes the file anew, and its
# field order may differ).
- tapOn: "Export"
- extendedWaitUntil: { visible: "export: forms.pdf", timeout: 10000 }
- tapOn: "Open"
- extendedWaitUntil: { visible: "1 / 2", timeout: 15000 }
- waitForAnimationToEnd
- tapOn: "Fields"
- extendedWaitUntil:
    visible: "fields 13: (?=.*name=Ewa )(?=.*notes=First line/Second line )(?=.*agree=on )(?=.*plan=pro )(?=.*country=France )(?=.*colours=Blue )(?=.*id=A-1234 )(?=.*address.city=Kraków( |$)).*"
    timeout: 5000
- takeScreenshot: forms-exported
- tapOn: "‹ Back"

# A downloaded form: onLoad's filePath is the cache's copy. Exports over it,
# or beside it where another document's copy would be, are rejected, so the
# filled-in form never reaches the cache: reopened, it is as served.
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "Remote form(, .*)?" } }
- extendedWaitUntil: { visible: "1 / 2", timeout: 15000 }
- waitForAnimationToEnd
- tapOn: "Fill"
- extendedWaitUntil: { visible: "fill: done", timeout: 5000 }
- tapOn: "Bad"
- extendedWaitUntil: { visible: "bad: .*read-only.* \\| .*cannot replace the displayed.* \\| .*export path is a directory.* \\| .*in the cache of downloaded documents.*; keep.txt kept", timeout: 10000 }
- tapOn: "‹ Back"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "Remote form(, .*)?" } }
- extendedWaitUntil: { visible: "1 / 2", timeout: 15000 }
- waitForAnimationToEnd
- tapOn: "Fields"
- extendedWaitUntil:
    visible: "fields 13: name= email=jan@example.com notes= agree=off plan=basic country=Poland colours=Green id=A-1234 phone= address.city= postcode= date= signature=unsigned"
    timeout: 5000
- tapOn: "‹ Back"
