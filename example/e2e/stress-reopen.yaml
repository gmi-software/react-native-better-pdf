# Opens a document 80 times in a row, closing each viewer right after it
# loads. iOS 26 leaves one thread blocked for good per viewer closed while
# PDFKit still analyzes its page; past 64 of them, documents must still load.
# Debug builds load the bundled sample from Metro over HTTP (DocumentCache);
# `file` and `remote` need the fixture server.
appId: software.gmi.betterpdf.example
---
- runFlow: _start.yaml
- openLink: betterpdfexample://reopen?count=80&source=${SOURCE || 'bundled'}
# iOS asks before a link opens the app.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Reopened 80 / 80"
    timeout: 180000
