# Encrypted PDF: password-required → invalid-password → unlocked.
# Android < 15 reports unsupported-pdf instead (PdfRenderer limitation).
# Passwords are submitted with buttons: Maestro text input accumulates text in
# secure fields on Android, which would test Maestro rather than the viewer.
appId: software.gmi.betterpdf.example
---
- runFlow: _start.yaml
- tapOn: "Viewer"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "encrypted.*" } }
- extendedWaitUntil: { visible: "password-required", timeout: 15000 }
- tapOn: "Try wrong"
- extendedWaitUntil: { visible: "invalid-password", timeout: 15000 }
- tapOn: "Try fixture"
- extendedWaitUntil: { visible: "1 / 2", timeout: 15000 }
- takeScreenshot: viewer-password
- tapOn: "‹ Back"
