# Every failure mode surfaces a stable error code instead of crashing.
appId: software.gmi.betterpdf.example
---
- runFlow: _start.yaml
- tapOn: "Viewer"
- tapOn: "Missing file.*"
- extendedWaitUntil: { visible: "file-not-found", timeout: 10000 }
- tapOn: "‹ Back"
- tapOn: "Remote 404.*"
- extendedWaitUntil: { visible: "http-error", timeout: 15000 }
- tapOn: "‹ Back"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "malformed-not-a-pdf.*" } }
- extendedWaitUntil: { visible: "invalid-pdf", timeout: 15000 }
- tapOn: "‹ Back"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "malformed-empty.*" } }
- extendedWaitUntil: { visible: "invalid-pdf", timeout: 15000 }
- tapOn: "‹ Back"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "malformed-truncated.*" } }
# Truncated files are either rejected or partially recovered, never a crash.
- extendedWaitUntil:
    visible: "invalid-pdf|1 / .*"
    timeout: 15000
- tapOn: "‹ Back"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "malformed-garbage-xref.*" } }
- extendedWaitUntil:
    visible: "invalid-pdf|1 / 3"
    timeout: 15000
- tapOn: "‹ Back"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "Base64 not base64.*" } }
- extendedWaitUntil: { visible: "invalid-source", timeout: 10000 }
- assertVisible: "The base64 source is not valid base64: unexpected character at index 12"
- tapOn: "‹ Back"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "Base64 data: URI.*" } }
- extendedWaitUntil: { visible: "invalid-source", timeout: 10000 }
- assertVisible: "The base64 source is a data: URI; pass only the part after \"base64,\""
- tapOn: "‹ Back"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "Base64 not a PDF.*" } }
- extendedWaitUntil: { visible: "invalid-pdf", timeout: 10000 }
- tapOn: "‹ Back"
