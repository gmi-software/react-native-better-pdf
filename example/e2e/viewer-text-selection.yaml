# Text selection (bundled sample, page 1 starts with the heading "Page 1").
# Every onTextSelectionChange is numbered by the example ("selection #n"), so
# the flow checks that each gesture sends exactly one event: the long press,
# the whole handle drag, and the clear.
# Android selects text from Android 15 (API 35); the emulator used is API 35.
appId: software.gmi.betterpdf.example
env:
  # The word "Page" in the heading.
  WORD: "${maestro.platform == 'ios' ? '11%, 33%' : '10%, 32%'}"
---
- runFlow: _start.yaml
- tapOn: "Viewer"
- tapOn: "Bundled sample.*"
- extendedWaitUntil: { visible: "1 / 3", timeout: 15000 }
# A long press selects the word under the finger.
- longPressOn: { point: "${WORD}" }
- extendedWaitUntil:
    visible: 'selection #1: "Page"'
    timeout: 5000
- assertVisible: "Copy"
# Dragging the stop handle extends the selection over the next line; the
# whole drag is one event.
# Swipe points must be literals: from the stop handle below "Page" down to
# the next line.
- runFlow:
    when: { platform: iOS }
    commands:
      - swipe: { start: "15%, 34%", end: "40%, 36%", duration: 2000 }
- runFlow:
    when: { platform: Android }
    commands:
      - swipe: { start: "18%, 34%", end: "40%, 37%", duration: 2000 }
- extendedWaitUntil:
    visible: 'selection #2: "Page 1 reprehenderit.*'
    timeout: 5000
- takeScreenshot: viewer-text-selection
# A tap elsewhere clears the selection (event #3) and is still a page tap.
- tapOn: { point: "60%, 60%" }
- extendedWaitUntil: { visible: "tap: page 1 at .*", timeout: 5000 }
- longPressOn: { point: "${WORD}" }
- extendedWaitUntil:
    visible: 'selection #4: "Page"'
    timeout: 5000
# Turning selection off clears it, and long presses select nothing.
- tapOn: "Sel on"
- extendedWaitUntil:
    visible: 'selection #5: ""'
    timeout: 5000
- longPressOn: { point: "${WORD}" }
- waitForAnimationToEnd
- assertVisible: 'selection #5: ""'
- assertNotVisible: "Copy"
# Also in the paged layout, whose pages get new text views on iOS.
- tapOn: "Vertical"
- tapOn: "Horizontal"
- extendedWaitUntil: { visible: "Paged", timeout: 5000 }
- longPressOn: { point: "50%, 55%" }
- waitForAnimationToEnd
- assertVisible: 'selection #5: ""'
- assertNotVisible: "Copy"
# Turned back on, a long press selects again.
- tapOn: "Sel off"
- longPressOn: { point: "50%, 55%" }
- extendedWaitUntil:
    visible: 'selection #6: "[a-z]+"'
    timeout: 5000
- tapOn: "Paged"
- tapOn: "Paged H"
- tapOn: "RTL"
- tapOn: "Paged RTL"
- tapOn: "Pairs"
- tapOn: "Book"
- extendedWaitUntil: { visible: "Vertical", timeout: 5000 }
- tapOn: "‹ Back"
