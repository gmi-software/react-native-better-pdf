# Switching horizontal / enablePaging keeps the current page; paging moves
# exactly one page per swipe, however fast, along the layout's axis.
appId: software.gmi.betterpdf.example
---
# Starts fresh: the layout mode is screen state.
- runFlow: _start.yaml
- tapOn: "Viewer"
- runFlow: { file: _open-list-entry.yaml, env: { ENTRY: "medium.*" } }
- extendedWaitUntil: { visible: "1 / 100", timeout: 60000 }

# Vertical → Horizontal (continuous): a slow drag of 80% of the width.
- tapOn: "Vertical"
- extendedWaitUntil: { visible: "Horizontal", timeout: 5000 }
- waitForAnimationToEnd
- swipe: { start: "90%, 50%", end: "10%, 50%", duration: 1500 }
- waitForAnimationToEnd
- assertVisible: "2 / 100"
- takeScreenshot: layout-horizontal

# Horizontal → Paged: page kept, one fast swipe = one page.
- tapOn: "Horizontal"
- extendedWaitUntil: { visible: "Paged", timeout: 5000 }
- waitForAnimationToEnd
- assertVisible: "2 / 100"
# A swipe Maestro drops on a slow emulator is sent again (retry); one
# that turns two pages still fails.
- retry:
    maxRetries: 2
    commands:
      - swipe: { start: "50%, 80%", end: "50%, 20%", duration: 150 }
      - extendedWaitUntil: { visible: "3 / 100", timeout: 5000 }
- takeScreenshot: layout-paged

# Paged → Paged H: each fast swipe is exactly one page.
- tapOn: "Paged"
- extendedWaitUntil: { visible: "Paged H", timeout: 5000 }
- waitForAnimationToEnd
- assertVisible: "3 / 100"
- retry:
    maxRetries: 2
    commands:
      - swipe: { start: "90%, 50%", end: "10%, 50%", duration: 150 }
      - extendedWaitUntil: { visible: "4 / 100", timeout: 5000 }
- retry:
    maxRetries: 2
    commands:
      - swipe: { start: "90%, 50%", end: "10%, 50%", duration: 150 }
      - extendedWaitUntil: { visible: "5 / 100", timeout: 5000 }
- retry:
    maxRetries: 2
    commands:
      - swipe: { start: "90%, 50%", end: "10%, 50%", duration: 150 }
      - extendedWaitUntil: { visible: "6 / 100", timeout: 5000 }
- takeScreenshot: layout-paged-horizontal

# Back to vertical continuous (through the RTL modes): page kept.
- tapOn: "Paged H"
- tapOn: "RTL"
- tapOn: "Paged RTL"
- tapOn: "Pairs"
- tapOn: "Book"
- extendedWaitUntil: { visible: "Vertical", timeout: 5000 }
- waitForAnimationToEnd
- assertVisible: "6 / 100"
- tapOn: "Last"
- extendedWaitUntil: { visible: "100 / 100", timeout: 5000 }
- takeScreenshot: layout-vertical
- tapOn: "‹ Back"
