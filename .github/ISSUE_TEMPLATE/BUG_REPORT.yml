name: 🐛 Bug Report
description: A document renders, scrolls or behaves incorrectly at runtime
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Explain what you were trying to do and what happened instead. Be as precise as possible — an issue that cannot be understood cannot be fixed.
      placeholder: 'I opened a 300-page remote document with `cache="persistent"` and after an app restart `onLoad` fired with `pageCount: 0`.'
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduceable code
      description: >
        Share a small reproduceable snippet — ideally the whole component.
        Include the `PdfView` props you set, the `source`, and any imperative `PdfViewRef` or `PdfDocument` calls.

        **Redact secrets first.** Replace tokens, signed URLs and `headers` values with placeholders — this issue is public.
      render: tsx
      placeholder: |
        <PdfView
          source={{ uri: 'https://example.com/report.pdf', cache: 'persistent' }}
          onLoad={(e) => console.log(e.pageCount)}
        />
    validations:
      required: true
  - type: textarea
    attributes:
      label: The document
      description: >
        Many bugs depend on the file itself. Attach the PDF if you can, or a file that shows the same problem.
        If you cannot share it, describe it: page count, page sizes, password protection, forms, scanned or text, and what produced it.

        **Do not attach documents with personal or confidential data** — this issue is public.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant log output
      description: >
        Paste any relevant **native log output** here. This is automatically formatted as code, so no backticks are needed.

        * For iOS, run the app from Xcode and copy the console output.

        * For Android, use the Android Studio Logcat window or run `adb logcat` in a terminal.

        If a crafted document crashes, hangs or exhausts the app — or the library opens a URL or runs a document's JavaScript — do not post it here: report it privately through a [security advisory](https://github.com/gmi-software/react-native-better-pdf/security/advisories/new).
      render: shell
    validations:
      required: false
  - type: dropdown
    attributes:
      label: Platforms
      description: Select every platform you reproduced this on.
      multiple: true
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: input
    attributes:
      label: Device
      description: >
        Which device shows the problem? Give the full name plus the OS version, and say whether it is a simulator/emulator or a physical device.
        On Android 12–14, say whether the device has SDK extension 13 (see the [capability matrix](https://github.com/gmi-software/react-native-better-pdf#capability-matrix)).
        If you tested several, list them comma separated.
      placeholder: ex. iPhone 16 Pro (iOS 26.1, simulator), Pixel 7 (Android 14, SDK extension 13, physical)
    validations:
      required: true
  - type: input
    attributes:
      label: react-native-better-pdf version
      placeholder: ex. 1.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: React Native version
      description: The library requires 0.83+ with the New Architecture enabled.
      placeholder: ex. 0.86.3
    validations:
      required: true
  - type: input
    attributes:
      label: react-native-nitro-modules version
      placeholder: ex. 0.37.1
    validations:
      required: true
  - type: input
    attributes:
      label: Expo SDK version
      description: Leave empty if this is a bare React Native app.
      placeholder: ex. 57.0.0
    validations:
      required: false
  - type: dropdown
    attributes:
      label: Can you reproduce this in the example app?
      description: >
        Run the example app (`example/`, see [Example app](https://github.com/gmi-software/react-native-better-pdf#example-app)) with your document and check whether the problem shows up there too.
        **Note:** an issue that does not reproduce in the example app and ships no reproduction is much harder to act on.
      options:
        - I didn't try (⚠️ your issue may take much longer to get looked at)
        - Yes, I can reproduce it in the example app
        - 'No, the example app works fine'
      default: 0
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Additional information
      description: Please check all the boxes that apply
      options:
        - label: I am using Expo with a development build
        - label: The document is downloaded (a remote `uri`)
        - label: The document is password protected
        - label: I am using `PdfCache` or a `cache` option
        - label: I checked [Common problems](https://github.com/gmi-software/react-native-better-pdf#common-problems) and [Limitations](https://github.com/gmi-software/react-native-better-pdf#limitations), and my issue is not listed there.
          required: true
        - label: I searched for [similar issues in this repository](https://github.com/gmi-software/react-native-better-pdf/issues) and found none.
          required: true
