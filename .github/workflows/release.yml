name: Release

# Publishing is driven by a version tag, not by a commit pushed from CI: `main`
# is protected, so github-actions[bot] cannot push a release commit to it. The
# version bump lands through a normal reviewed pull request, and pushing the
# matching tag afterwards triggers the publish.
#
# A run reads this file from its own ref, so the checks in it only catch
# mistakes. The settings that stop an edited copy from publishing live outside
# the repository and are listed in RELEASING.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Rehearsal against the current branch. Always a dry run: it validates the
  # version and the full gate without tagging or publishing anything.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # First, so a tag on a branch fails in seconds and not after the native builds.
  on-main:
    name: Commit is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, so origin/main exists to compare against.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the commit is on main
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main was not fetched, so the commit cannot be checked."
            exit 1
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is on main."
          elif [ "$EVENT_NAME" = 'push' ]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge the release pull request, then tag the commit on main."
            exit 1
          else
            # A rehearsal publishes nothing, and its use is to try a release
            # branch before it is merged.
            echo "::warning::$GITHUB_SHA is not on main. The rehearsal continues, but a tag on this commit would be rejected."
          fi

  # Native pull request runs are `paths:`-filtered and advisory, so this is the
  # step that actually stops a broken native build from being published.
  native:
    needs: [on-main]
    permissions:
      contents: read
    uses: ./.github/workflows/native-build.yml

  release:
    needs: [on-main, native]
    runs-on: ubuntu-latest
    # A rehearsal stays outside the environment: it publishes nothing, and the
    # environment admits only version tags.
    environment: ${{ github.event_name == 'push' && 'npm' || '' }}
    permissions:
      # Create the GitHub Release for the pushed tag.
      contents: write
      # Mint the OIDC token npm exchanges for a short-lived publish token, and
      # sign the provenance attestation.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so conventional-changelog can build the release notes
          # from every commit since the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm >= 11.5.1, required for npm trusted publishing.
          # `registry-url` is deliberately omitted: it writes an `_authToken`
          # entry into .npmrc, which makes npm assume classic token auth and skip
          # the OIDC flow. The registry is already pinned by publishConfig.
          node-version: 24

      - name: Verify npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          required=11.5.1
          echo "npm $npm_version (need >= $required)"
          if [ "$(printf '%s\n%s\n' "$required" "$npm_version" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $npm_version is too old for trusted publishing (need >= $required)."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          version="$(node -p "require('./package/package.json').version")"
          echo "package.json version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION. Bump the version on main first."
            exit 1
          fi

      - name: Verify version is not already published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "react-native-better-pdf@$VERSION" version >/dev/null 2>&1; then
            echo "::error::react-native-better-pdf@$VERSION is already on npm."
            exit 1
          fi

      - name: Verify the Nitro bindings are up to date
        run: |
          bun run specs
          if [ -n "$(git status --porcelain -- package/nitrogen)" ]; then
            git status --short -- package/nitrogen
            echo "::error::package/nitrogen is out of date. Run 'cd package && bun run specs' and commit the result."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Copy README into the package
        # npm reads the README shown on the registry page from the package
        # directory while it builds the manifest, before any pack script runs.
        # The `prepack` copy therefore never reaches the registry (react-native-
        # better-maps 1.0.0 through 1.2.0 all show "No README data found!"); the
        # file must exist here first.
        run: cp README.md package/README.md

      - name: Publish
        working-directory: package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --no-increment: the version already lives in package.json, reviewed
          #   and merged through a pull request.
          # --no-git: the tag is pushed by the maintainer; CI never writes to git.
          args=(--ci --no-increment --no-git)
          if [ "${{ github.event_name }}" != 'push' ]; then
            args+=(--dry-run)
            echo 'Rehearsal run — nothing will be tagged or published.'
          fi
          bunx release-it "${args[@]}"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Release v$VERSION"
            echo
            if [ "${{ github.event_name }}" != 'push' ]; then
              echo "Rehearsal only — nothing was published."
            else
              echo "- [npm](https://www.npmjs.com/package/react-native-better-pdf/v/$VERSION)"
              echo "- [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
